<title>Big Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a two-story building cut open at dusk, one room per project, a donut café in the
   middle of the ground floor, and a narrow annex on the right. Placards hang under each room. */
:root {
  color-scheme: dark;
  --night: #12152b;
  --dusk: #2a2650;
  --glow: #ffd79a;
  --facade: #3b3046;
  --facade-hi: #4a3d57;
  --slab: #6d6478;
  --plate: #191b24;
  --plate-edge: #b9975a;
  --ink: #f6eedf;
  --ink-soft: #c9c0d6;
  --ink-mute: #9890a8;
  --panel: #1d1f2c;
  --panel-line: #33364a;
  --st-active: #52c47d;
  --st-blocked: #f05a4b;
  --st-review: #f4b740;
  --st-shipped: #b58cf5;
  --st-parked: #8e93a8;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body {
  background: linear-gradient(180deg, #10132a 0%, #231f47 38%, #5a3560 72%, #a4566a 92%, #c9705f 100%);
  background-color: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100%;
}
.page { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 0; position: relative; }
.stars { position: absolute; inset: 0 0 auto 0; height: 260px; pointer-events: none; opacity: .8;
  background-image: radial-gradient(1.4px 1.4px at 8% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 22% 12%, #fff 50%, transparent 51%),
  radial-gradient(1.2px 1.2px at 41% 40%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 57% 18%, #fff 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 73% 34%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 10%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 95% 44%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 32% 52%, #fff 50%, transparent 51%); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; margin-bottom: 26px; position: relative; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 44px); letter-spacing: .5px; margin: 0; line-height: 1; color: var(--ink); text-shadow: 0 3px 0 #0006; }
.brand p { margin: 8px 0 0; color: var(--ink-soft); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend .lg { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 8px; border-radius: 999px; background: #0007; border: 1px solid #ffffff1a; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.legend .lg b { color: var(--ink); font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--st-parked); box-shadow: 0 0 0 2px #0005; }
.dot.active { background: var(--st-active); } .dot.blocked { background: var(--st-blocked); } .dot.review { background: var(--st-review); }
.dot.shipped { background: var(--st-shipped); } .dot.parked { background: var(--st-parked); }

/* building */
.building { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1fr); position: relative; }
.roof { grid-column: 1 / 4; height: 34px; background: linear-gradient(#2c2436, #3b3046); border-radius: 6px 6px 0 0; position: relative; box-shadow: inset 0 4px 0 #574a66; }
.roof::before { content: ""; position: absolute; left: 12%; bottom: 100%; width: 70px; height: 26px; background: #2c2436; border-radius: 4px 4px 0 0; box-shadow: 120px 6px 0 -4px #2c2436; }
.roof::after { content: ""; position: absolute; right: 9%; bottom: 100%; width: 6px; height: 46px; background: #574a66; border-radius: 3px; }
.roof.annex { grid-column: 4; margin-left: 18px; margin-top: 18px; height: 16px; border-radius: 6px 6px 0 0; }
.roof.annex::before, .roof.annex::after { display: none; }
.room { background: var(--facade); padding: 10px 10px 0; display: flex; flex-direction: column; min-width: 0; border-bottom: 12px solid var(--slab); box-shadow: inset 0 -2px 0 #0004; }
.room.annex { margin-left: 18px; background: var(--facade-hi); }
.room { border-inline: 5px solid #2c2436; } .room.annex { border-inline: 8px solid #2c2436; }
.scene { position: relative; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 3px #0006, 0 2px 0 #fff1; background: #0b0d18; cursor: pointer; }
.scene svg { display: block; width: 100%; height: auto; }
.scene:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
.room-label { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .4px; color: #ffe4c4; text-align: center; padding: 8px 0 10px; }

/* placards */
.placard { flex: 1; position: relative; margin: 10px 4px 12px; background: var(--plate); border: 2px solid var(--plate-edge); border-radius: 6px; padding: 10px 12px 10px; box-shadow: 0 3px 0 #0008, inset 0 1px 0 #ffffff14; min-height: 128px; display: flex; flex-direction: column; gap: 6px; }
.placard::before, .placard::after { content: ""; position: absolute; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f3dca8, #8a6a33); }
.placard::before { left: 6px; } .placard::after { right: 6px; }
.pl-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 6px; }
.pl-name { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .3px; color: var(--ink); line-height: 1.15; min-width: 0; }
.chip { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px 2px; border-radius: 4px; color: #16131c; background: var(--st-parked); }
.chip.active { background: var(--st-active); } .chip.blocked { background: var(--st-blocked); color: #fff; } .chip.review { background: var(--st-review); }
.chip.shipped { background: var(--st-shipped); } .chip.parked { background: var(--st-parked); } .chip.none { background: #3a3d50; color: var(--ink-soft); }
.pl-step { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.4; padding-inline: 6px; flex: 1; }
.pl-step b { color: var(--ink); font-weight: 600; }
.pl-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { appearance: none; font: 600 12.5px/1 var(--body); color: #1b1420; background: var(--glow); border: 0; border-radius: 6px; padding: 8px 10px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 2px 0 #9a6d2e; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #ffffff33; box-shadow: none; }
.btn.ghost:hover { background: #ffffff12; }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn svg { width: 14px; height: 14px; }
.cafe-who { display: flex; flex-wrap: wrap; gap: 6px; padding-inline: 6px; }
.cafe-who span { font-size: 12.5px; padding: 3px 8px; border-radius: 4px; background: #ffffff10; color: var(--ink-soft); }

.street { height: 46px; background: linear-gradient(#2b2733 0 10px, #1b1922 10px); border-top: 3px solid #4a4452; position: relative; margin-inline: -20px; }
.street::after { content: ""; position: absolute; left: 0; right: 0; top: 26px; height: 3px; background: repeating-linear-gradient(90deg, #d8c27a55 0 34px, transparent 34px 70px); }
.foot { background: #1b1922; margin-inline: -20px; padding-inline: 20px; color: var(--ink-mute); font-size: 12.5px; padding-block: 14px 26px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* side panel */
.backdrop { position: fixed; inset: 0; background: #05060cb0; z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--panel-line); z-index: 21; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) 22px calc(env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; gap: 18px; }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; line-height: 1.1; }
.panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel .x { background: none; border: 1px solid #ffffff2a; color: var(--ink); width: 34px; height: 34px; border-radius: 8px; font-size: 18px; cursor: pointer; flex: none; }
.panel h3 { font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 8px; font-weight: 700; }
.panel p { margin: 0; color: var(--ink-soft); }
.term { background: #0b0c12; border: 1px solid #2c2f40; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.term code { font-family: var(--mono); font-size: 13px; color: #9ff0b8; white-space: pre-wrap; word-break: break-all; user-select: all; }
.term code::before { content: "$ "; color: #59607a; }
.term small { color: var(--ink-mute); font-size: 12px; }
.links { display: flex; flex-direction: column; gap: 6px; }
.links a { color: var(--glow); text-decoration: none; font-weight: 600; font-size: 14px; }
.links a:hover { text-decoration: underline; }
form.edit { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--panel-line); padding-top: 16px; }
form.edit label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
form.edit input, form.edit select, form.edit textarea { font: 14px/1.4 var(--body); color: var(--ink); background: #11131c; border: 1px solid #353950; border-radius: 6px; padding: 8px 10px; width: 100%; }
form.edit textarea { min-height: 64px; resize: vertical; }
form.edit input:focus, form.edit select:focus, form.edit textarea:focus { outline: 2px solid var(--glow); outline-offset: 0; }
.states { display: flex; flex-wrap: wrap; gap: 6px; }
.states button { font: 600 12.5px var(--body); padding: 7px 10px; border-radius: 6px; border: 1px solid #3a3e56; background: #14161f; color: var(--ink-soft); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.states button[aria-pressed="true"] { border-color: var(--glow); color: var(--ink); background: #2a2433; }
.msg { font-size: 12.5px; color: var(--ink-mute); min-height: 1em; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: #0d0f17; color: var(--ink); border: 1px solid var(--plate-edge); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; z-index: 30; max-width: calc(100% - 32px); }

/* svg motion */
.a-type { animation: type 0.8s ease-in-out infinite; }
.a-sway { animation: sway 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.a-jump { animation: jump .9s cubic-bezier(.3,.6,.4,1) infinite; }
.a-lift { animation: lift 1.8s ease-in-out infinite; }
.a-sip { animation: sip 3.2s ease-in-out infinite; }
.cf { animation: fall 2.8s linear infinite; }
.blink { animation: blink 1.1s steps(2, jump-none) infinite; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.smoke { animation: smoke 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.qm { animation: bobq 1.8s ease-in-out infinite; }
@keyframes type { 50% { transform: translateY(-1.3px); } }
@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes jump { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-9px); } }
@keyframes lift { 50% { transform: translateY(-3px); } }
@keyframes sip { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-1.5px); } }
@keyframes fall { 0% { transform: translateY(-30px) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(170px) rotate(540deg); opacity: .8; } }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }
@keyframes pulse { 50% { opacity: .02; } }
@keyframes smoke { 0% { transform: translateY(0) scale(.6); opacity: .8; } 100% { transform: translateY(-26px) scale(1.4); opacity: 0; } }
@keyframes bobq { 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }

@media (max-width: 1100px) {
  .building { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .roof, .roof.annex { grid-column: 1 / -1; margin: 0; }
  .roof.annex { display: none; }
  .room, .room.annex { margin-left: 0; border-inline: 6px solid #2c2436; }
}
@media (max-width: 640px) {
  .page { padding-inline: 16px; }
  .street, .foot { margin-inline: -16px; }
  .foot { padding-inline: 16px; }
  .building { grid-template-columns: minmax(0, 1fr); }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="hl-head" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="hl-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0a3" stop-opacity=".55"/><stop offset="1" stop-color="#ffe0a3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="floor-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="sky-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26285a"/><stop offset=".55" stop-color="#9b4f78"/><stop offset="1" stop-color="#f3a05c"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3ff" stop-opacity=".5"/><stop offset="1" stop-color="#9fe3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="red-glow" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#ff3b30" stop-opacity=".5"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffe9da"/><rect width="10" height="10" fill="#ff8fb5"/><rect x="10" y="10" width="10" height="10" fill="#ff8fb5"/>
    </pattern>
    <pattern id="tiles" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="none" stroke="#000" stroke-opacity=".14"/>

    <pattern id="planks" width="40" height="9" patternUnits="userSpaceOnUse">
      <rect width="40" height="9" fill="none" stroke="#000" stroke-opacity=".12"/><line x1="18" y1="0" x2="18" y2="9" stroke="#000" stroke-opacity=".1"/>
    </pattern>
  </defs>
</svg>

<div class="page">
  <div class="stars"></div>
  <header class="top">
    <div class="brand">
      <h1>Big Projects</h1>
      <p id="asof">Your Claude Code projects, one room each. Tap a room for its terminal.</p>
    </div>
    <div class="legend" id="legend" aria-label="Project count by status"></div>
  </header>

  <main class="building" id="building">
    <div class="roof" aria-hidden="true"></div>
    <div class="roof annex" aria-hidden="true"></div>
  </main>
  <div class="street" aria-hidden="true"></div>
  <div class="foot">
    <span id="footnote">Statuses are saved with this page. Claude can update them for you, or tap a room and change it yourself.</span>
    <span>Parked crews wait in the Donut Café Lounge.</span>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="panel" id="panel" hidden aria-labelledby="panel-title" role="dialog"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
const STATES = ["active", "blocked", "review", "shipped", "parked"];
const STATE_LABEL = { active: "Active", blocked: "Blocked", review: "In review", shipped: "Shipped", parked: "Parked" };
const SKINS = ["#f3c9a5", "#d9a07a", "#a9714d", "#7b4a2f", "#f6d8bd", "#c58c64"];
const HAIRS = ["#2d2026", "#6b3e22", "#c98b3a", "#3b2a1e", "#8a2f2a", "#1d1a21"];

/* crew looks, keyed by room id */
const CREWS = {
  jetstream:   { hat: "pilot",  shirts: ["#3e6aa8", "#2f5891", "#4a78b8"], pants: "#2b3348", off: 0 },
  pace:        { hat: "atc",    shirts: ["#e2793d", "#d0682e", "#ea8a4f"], pants: "#33303f", off: 2 },
  secondbrain: { hat: "grad",   shirts: ["#7a55b0", "#6a4699", "#8a66c0"], pants: "#2e2a3c", off: 4 },
  kw:          { hat: "hard",   shirts: ["#2f7a7e", "#256a6e", "#3b8a8e"], pants: "#2b3a4a", off: 1 },
  upwork:      { hat: "beret",  shirts: ["#d1516f", "#3c9a6b", "#5367c9"], pants: "#2f2b38", off: 3 },
  bnolan:      { hat: "beanie", shirts: ["#1f8a74", "#f0a33a", "#196f60"], pants: "#26303a", off: 5 },
};

/* the building: which room sits where. Names come from saved data; these are fallbacks. */
const ROOMS = [
  { id: "jetstream", label: "Jetstream", pos: "c1" },
  { id: "pace", label: "Pace", pos: "c2" },
  { id: "secondbrain", label: "Second Brain", pos: "c3" },
  { id: "bnolan", label: "BNolan Design Site", pos: "annex" },
  { id: "kw", label: "K&W Campaign", pos: "c1" },
  { id: "cafe", label: "Donut Café Lounge", pos: "c2" },
  { id: "upwork", label: "Upwork / Fiverr", pos: "c3" },
  { id: "empty", label: "", pos: "annex" },
];
const PROJECT_IDS = ["jetstream", "pace", "secondbrain", "kw", "upwork", "bnolan"];

/* ---------- helpers ---------- */
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct) / 100;
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (n) => +n.toFixed(1);

/* ---------- people ---------- */
function hat(kind, i) {
  switch (kind) {
    case "pilot": return `
      <path d="M-14,-46 Q-13,-62 0,-62 Q13,-62 14,-46 Z" fill="#26324d"/>
      <rect x="-14.5" y="-48" width="29" height="4" rx="2" fill="#151c2e"/>
      <path d="M-2,-46 Q12,-48 19,-44 Q10,-42 -2,-44 Z" fill="#111827"/>
      <rect x="-12" y="-56.5" width="24" height="3" rx="1.5" fill="#6b4a2b"/>
      <circle cx="-5" cy="-55" r="4" fill="#9ad8ec" stroke="#6b4a2b" stroke-width="1.6"/>
      <circle cx="5" cy="-55" r="4" fill="#9ad8ec" stroke="#6b4a2b" stroke-width="1.6"/>
      <circle cx="-6.2" cy="-56.2" r="1.2" fill="#fff" opacity=".8"/><circle cx="3.8" cy="-56.2" r="1.2" fill="#fff" opacity=".8"/>
      <path d="M-14,-46 Q-13,-62 0,-62 Q13,-62 14,-46 Z" fill="url(#hl-head)"/>`;
    case "atc": return `
      <path d="M-13.5,-47 Q-13,-61 0,-61 Q13,-61 13.5,-47 Z" fill="#f08a3e"/>
      <path d="M2,-48 Q16,-50 22,-45 Q12,-43 2,-45 Z" fill="#c9652a"/>
      <circle cx="0" cy="-60" r="1.6" fill="#c9652a"/>
      <path d="M-14,-44 Q-15,-64 0,-64 Q15,-64 14,-44" fill="none" stroke="#2a2a33" stroke-width="2.4"/>
      <rect x="-18" y="-47" width="6" height="10" rx="3" fill="#2a2a33"/><rect x="12" y="-47" width="6" height="10" rx="3" fill="#2a2a33"/>
      <path d="M15,-39 Q14,-33 6,-33" fill="none" stroke="#2a2a33" stroke-width="1.6"/><circle cx="5.5" cy="-33" r="1.8" fill="#2a2a33"/>
      <path d="M-13.5,-47 Q-13,-61 0,-61 Q13,-61 13.5,-47 Z" fill="url(#hl-head)"/>`;
    case "grad": return `
      <rect x="-10" y="-56" width="20" height="8" rx="2" fill="#1f1b29"/>
      <polygon points="0,-64 20,-57 0,-50 -20,-57" fill="#2a2536"/>
      <polygon points="0,-64 20,-57 0,-50 -20,-57" fill="url(#hl-head)"/>
      <circle cx="0" cy="-57" r="1.4" fill="#e7c25a"/>
      <path d="M0,-57 L15,-55 L15,-46" fill="none" stroke="#e7c25a" stroke-width="1.3"/>
      <rect x="13.6" y="-47" width="2.8" height="5" rx="1" fill="#e7c25a"/>`;
    case "hard": return `

function person(o) {
  const { x, y, s = 0.8, crew, pose = "stand", i = 0, flip = false, board = "", mood } = o;
  const c = CREWS[crew];
  const skin = SKINS[(i + c.off) % SKINS.length];
  const hair = HAIRS[(i * 2 + c.off) % HAIRS.length];
  const shirt = c.shirts[i % c.shirts.length];
  const sleeve = shade(shirt, -14);
  const anim = { sit: "a-type", hips: "a-sway", scratch: "a-sway", hold: "a-lift", cheer: "a-jump", cafe: "a-sip", point: "a-sway" }[pose] || "";
  const A = (pts) => {
    const last = pts.trim().split(" ").pop().split(",");
    return `<polyline points="${pts}" fill="none" stroke="${sleeve}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.3" fill="${skin}"/>`;
  };
  let arms;
  switch (pose) {
    case "sit": arms = A("-9,-27 -12,-19 -6,-15") + A("9,-27 12,-19 6,-15"); break;
    case "hips": arms = A("-9,-28 -18,-22 -10,-16") + A("9,-28 18,-22 10,-16"); break;
    case "scratch": arms = A("-9,-28 -18,-22 -10,-16") + A("9,-28 19,-40 12,-51"); break;
    case "hold": arms = A("-9,-28 -17,-45 -14,-62") + A("9,-28 17,-45 14,-62"); break;
    case "cheer": arms = A("-9,-28 -18,-44 -22,-59") + A("9,-28 18,-44 22,-59"); break;
    case "point": arms = A("-9,-28 -14,-20 -10,-15") + A("9,-28 18,-38 25,-50"); break;
    case "cafe": arms = A("-9,-27 -13,-19 -7,-15") + A("9,-27 15,-21 9,-31") +
      `<rect x="5.5" y="-38" width="8" height="8" rx="1.6" fill="#fff8ee"/><rect x="5.5" y="-35" width="8" height="2.5" fill="#ff7a3d"/><path d="M13.5,-36 q3,1 0,4" fill="none" stroke="#fff8ee" stroke-width="1.4"/>`; break;
    default: arms = A("-9,-28 -12,-20 -11,-14") + A("9,-28 12,-20 11,-14");
  }
  const seated = pose === "sit" || pose === "cafe";
  const legs = seated ? "" : `
    <rect x="-7.5" y="-15" width="6.5" height="14" rx="3" fill="${c.pants}"/><rect x="1" y="-15" width="6.5" height="14" rx="3" fill="${c.pants}"/>
    <ellipse cx="-4.6" cy="-1.4" rx="4.8" ry="2.7" fill="#241f2a"/><ellipse cx="4.6" cy="-1.4" rx="4.8" ry="2.7" fill="#241f2a"/>`;
  const body = `<rect x="-11" y="-33" width="22" height="22" rx="9" fill="${shirt}"/><rect x="-11" y="-33" width="22" height="22" rx="9" fill="url(#hl-body)"/>
    <path d="M-4,-33 L0,-28 L4,-33" fill="none" stroke="${shade(shirt, 30)}" stroke-width="1.4"/>`;
  const m = mood || (pose === "cheer" ? "open" : (pose === "hips" || pose === "scratch") ? "worried" : "smile");
  const mouth = m === "open" ? `<ellipse cx="0" cy="-35" rx="2.8" ry="2.4" fill="#7a2d3a"/>`
    : m === "worried" ? `<path d="M-2.8,-34 Q0,-36.4 2.8,-34" fill="none" stroke="#5a2a33" stroke-width="1.4" stroke-linecap="round"/>`
    : `<path d="M-2.8,-36 Q0,-33.4 2.8,-36" fill="none" stroke="#5a2a33" stroke-width="1.4" stroke-linecap="round"/>`;
  const brows = m === "worried" ? `<path d="M-7.5,-46.5 L-3,-45" stroke="#3b2a28" stroke-width="1.3" stroke-linecap="round"/><path d="M7.5,-46.5 L3,-45" stroke="#3b2a28" stroke-width="1.3" stroke-linecap="round"/>` : "";
  const eyes = `<ellipse cx="-4.8" cy="-41.5" rx="1.9" ry="2.5" fill="#2b2233"/><ellipse cx="4.8" cy="-41.5" rx="1.9" ry="2.5" fill="#2b2233"/>
    <circle cx="-4.2" cy="-42.4" r=".7" fill="#fff"/><circle cx="5.4" cy="-42.4" r=".7" fill="#fff"/>`;
  const glasses = c.hat === "grad" ? `<circle cx="-5" cy="-41.5" r="4.2" fill="#ffffff22" stroke="#2b2233" stroke-width="1.3"/><circle cx="5" cy="-41.5" r="4.2" fill="#ffffff22" stroke="#2b2233" stroke-width="1.3"/><line x1="-.8" y1="-41.5" x2=".8" y2="-41.5" stroke="#2b2233" stroke-width="1.3"/>` : "";
  const head = `
    <path d="M-14.5,-41 Q-15,-56 0,-57 Q15,-56 14.5,-41 Q10,-49 0,-49 Q-10,-49 -14.5,-41 Z" fill="${hair}"/>
    <circle cx="0" cy="-43" r="13.6" fill="${skin}"/>
    <path d="M-13.4,-46 Q-10,-55 0,-56 Q10,-55 13.4,-46 Q8,-51 0,-51 Q-8,-51 -13.4,-46 Z" fill="${hair}"/>
    <circle cx="0" cy="-43" r="13.6" fill="url(#hl-head)"/>
    <ellipse cx="-8.4" cy="-37.6" rx="2.6" ry="1.5" fill="#ff7f86" opacity=".45"/><ellipse cx="8.4" cy="-37.6" rx="2.6" ry="1.5" fill="#ff7f86" opacity=".45"/>
    ${eyes}${brows}${glasses}${mouth}`;
  const sx = flip ? -s : s;
  return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${sx} ${s})">
    <ellipse cx="0" cy="0" rx="13" ry="3.4" fill="#000" opacity="${seated ? 0 : .3}"/>
    <g class="${anim}" style="animation-delay:${-(i * 0.41).toFixed(2)}s">
      ${legs}${body}${arms}${head}${hat(c.hat, i)}${board ? `<g transform="scale(${flip ? -1 : 1} 1)">${board}</g>` : ""}
    </g></g>`;
}

function roomSVG(id, ctx) {
  const sc = SCENES[id];
  const p = ctx.projects[id];
  const st = p ? p.state : "none";
  const lit = st !== "parked";
  let s = shell(sc.pal) + sc.back(st, ctx) + lamps(sc.lamps, lit);
  const n = sc.count ? sc.count(p) : 3;
  sc.desks.forEach((d, i) => {
    const seated = st === "active" && i < n;
    if (sc.chairs && !seated) s += chair(d);
    if (seated) s += person({ x: d.x, y: d.y - 4, s: .9, crew: id, pose: "sit", i });
    s += desk(d, seated || (lit && st !== "none" && !sc.chairs));
  });
  const cx = 160, cy = 215, cs = 1;
  if (st === "blocked") {
    s += person({ x: cx + 4, y: cy - 22, s: .78, crew: id, pose: "hips", i: 2 });
    s += problem(id, cx, cy - 4);
    s += person({ x: cx - 52, y: cy, s: cs, crew: id, pose: "hips", i: 0 });
    s += person({ x: cx + 52, y: cy, s: cs, crew: id, pose: "scratch", i: 1, flip: true });
    [[cx - 52, cy - 76], [cx + 60, cy - 80], [cx + 4, cy - 86]].forEach(([qx, qy], k) => {
      s += `<g class="qm" style="animation-delay:${-k * .5}s"><circle cx="${qx}" cy="${qy}" r="7.5" fill="#fff"/><text x="${qx}" y="${qy + 4}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="12" fill="#e5484d">?</text></g>`;
    });
  } else if (st === "review") {
    s += person({ x: cx - 46, y: cy, s: cs, crew: id, pose: "point", i: 0 });
    s += person({ x: cx + 46, y: cy, s: cs, crew: id, pose: "point", i: 2, flip: true });
    s += person({ x: cx, y: cy - 2, s: cs, crew: id, pose: "hold", i: 1, board: BOARDS[id] });
    s += `<g fill="#fff7c2"><path d="M${cx - 34},${cy - 100} l2,5 l5,2 l-5,2 l-2,5 l-2,-5 l-5,-2 l5,-2 z" class="blink"/><path d="M${cx + 34},${cy - 94} l1.5,4 l4,1.5 l-4,1.5 l-1.5,4 l-1.5,-4 l-4,-1.5 l4,-1.5 z" class="blink" style="animation-delay:-.5s"/></g>`;
  } else if (st === "shipped") {
    [-52, 0, 52].forEach((dx, i) => { s += person({ x: cx + dx, y: cy, s: cs, crew: id, pose: "cheer", i }); });
    const cc = ["#f05a4b", "#f4b740", "#52c47d", "#7aa7ff", "#ff8fb5", "#b58cf5"];
    for (let k = 0; k < 28; k++) {
      const x = 40 + ((k * 97) % 240), y = 10 + ((k * 37) % 40);
      s += `<rect x="${x}" y="${y}" width="4" height="7" rx="1" fill="${cc[k % 6]}" class="cf" style="animation-delay:${-((k * .31) % 2.8).toFixed(2)}s"/>`;
    }
  }
  if (!lit) s += `<rect width="320" height="220" fill="#05070f" opacity=".62"/>`;
  if (st === "blocked") {
    s += `<rect width="320" height="220" fill="url(#red-glow)" class="pulse"/>
      <rect x="152" y="12" width="16" height="4" fill="#2a2124"/><path d="M153,16 Q160,4 167,16 Z" fill="#ff3b30" class="blink"/>`;
  }
  const name = (p && p.name) || ROOMS.find((r) => r.id === id).label;
  const label = p ? `${name}: ${STATE_LABEL[st] || st}` : name;
  return `<svg viewBox="0 0 320 220" role="img" aria-label="${esc(label)}">${s}</svg>`;
}

    return `<div class="placard">
      <div class="pl-head"><span class="pl-name">Donut Café Lounge</span><span class="chip parked">${parked.length} parked</span></div>
      <p class="pl-step">${parked.length ? "On break here:" : state.loaded ? "No crews on break." : "Checking who's on break…"}</p>
      <div class="cafe-who">${parked.map((k) => `<span>${esc(state.projects[k].name || k)}</span>`).join("")}</div>
    </div>`;
  }
  const name = (p && p.name) || room.label;
  let chip, step;
  if (p) {
    chip = `<span class="chip ${esc(p.state)}">${esc(STATE_LABEL[p.state] || p.state)}</span>`;
    step = `<b>${esc(STATE_LABEL[p.state] || "")}:</b> ${esc(p.step || "No current step saved.")}`;
  } else {
    chip = `<span class="chip none">—</span>`;
    step = state.unavailable ? "Status can't load in this view." : state.loaded ? "No status saved yet." : "Checking in…";
  }
  const open = p && p.sessionUrl ? `<a class="btn" href="${esc(p.sessionUrl)}" target="_blank" rel="noopener">${ICON_EXT}Open workspace</a>` : "";
  return `<div class="placard">
    <div class="pl-head"><span class="pl-name">${esc(name)}</span>${chip}</div>
    <p class="pl-step">${step}</p>
    <div class="pl-actions">${open}<button class="btn ghost" type="button" data-open="${id}">${ICON_TERM}Terminal</button></div>
  </div>`;
}

function render() {
  const ctx = { projects: state.projects };
  building.querySelectorAll(".room").forEach((n) => n.remove());
  ROOMS.forEach((r) => {
    const el = document.createElement("section");
    el.className = "room " + (r.pos === "annex" ? "annex" : r.pos);
    if (r.id === "empty") {
      el.innerHTML = `<div class="scene" style="cursor:default">${emptySVG()}</div><div class="placard" style="visibility:hidden" aria-hidden="true"></div>`;
    } else if (r.id === "cafe") {
      el.innerHTML = `<div class="scene" style="cursor:default">${cafeSVG(ctx)}</div>${placardHTML("cafe")}`;
    } else {
      el.innerHTML = `<div class="scene" tabindex="0" role="button" data-open="${r.id}" aria-label="Open ${esc((state.projects[r.id] || {}).name || r.label)}">${roomSVG(r.id, ctx)}</div>${placardHTML(r.id)}`;
    }
    building.appendChild(el);
  });
  // legend
  const counts = {};
  PROJECT_IDS.forEach((id) => { const p = state.projects[id]; if (p) counts[p.state] = (counts[p.state] || 0) + 1; });
  document.getElementById("legend").innerHTML = STATES.map((k) => `<span class="lg"><span class="dot ${k}"></span>${STATE_LABEL[k]} <b>${counts[k] || 0}</b></span>`).join("");
  const dates = PROJECT_IDS.map((id) => state.projects[id] && state.projects[id].updatedAt).filter(Boolean).sort();
  if (dates.length) {
    const d = new Date(dates[dates.length - 1] + "T12:00:00");
    document.getElementById("asof").textContent = `Your Claude Code projects, one room each. Last update ${d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}. Tap a room for its terminal.`;
  }
  if (state.openId) renderPanel(state.openId);
}

/* ---------- side panel ---------- */
const panel = document.getElementById("panel"), backdrop = document.getElementById("backdrop");
let draftState = null;
function openPanel(id) { state.openId = id; draftState = null; renderPanel(id); panel.hidden = false; backdrop.hidden = false; panel.querySelector(".x").focus(); }
function closePanel() { state.openId = null; panel.hidden = true; backdrop.hidden = true; }
function renderPanel(id) {
  const p = state.projects[id] || {};
  const room = ROOMS.find((r) => r.id === id);
  const name = p.name || room.label;
  const cmd = p.command || "claude";
  const st = draftState || p.state;
  const links = [];
  if (p.sessionUrl) links.push({ label: "Open the workspace in Claude Code", url: p.sessionUrl });
  (p.links || []).forEach((l) => l && l.url && links.push(l));
  const editable = state.db && state.canWrite !== false;
  const focusId = document.activeElement && document.activeElement.id;
  panel.innerHTML = `
    <div class="row"><h2 id="panel-title">${esc(name)}</h2><button class="x" type="button" aria-label="Close">×</button></div>
    <div>${p.state ? `<span class="chip ${esc(p.state)}">${esc(STATE_LABEL[p.state])}</span>` : ""}
      <p style="margin-top:10px">${esc(p.step || "No current step saved.")}</p></div>
    <div>
      <h3>Terminal</h3>
      <div class="term"><code id="cmd">${esc(cmd)}</code>
        <div class="row"><small>${esc(p.commandNote || "Paste into Terminal on your Mac to pick this project up there.")}</small><button class="btn" type="button" id="copy">Copy</button></div>
      </div>
    </div>
    ${links.length ? `<div><h3>Links</h3><div class="links">${links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div></div>` : ""}
    ${p.updatedAt ? `<p style="font-size:12.5px;color:var(--ink-mute)">Updated ${esc(p.updatedAt)}</p>` : ""}
    ${editable ? `<form class="edit" id="edit">
      <h3 style="margin:0">Update this room</h3>
      <div class="states" role="group" aria-label="Status">${STATES.map((k) => `<button type="button" data-state="${k}" aria-pressed="${st === k}"><span class="dot ${k}"></span>${STATE_LABEL[k]}</button>`).join("")}</div>
      <label for="f-step">Current step, one plain sentence<textarea id="f-step">${esc(p.step || "")}</textarea></label>
      <label for="f-url">Workspace link<input id="f-url" type="url" value="${esc(p.sessionUrl || "")}" placeholder="https://claude.ai/code/session_…"></label>
      <label for="f-cmd">Terminal command<input id="f-cmd" value="${esc(p.command || "")}" placeholder="claude --teleport session_…"></label>
      <div class="row"><span class="msg" id="msg"></span><button class="btn" type="submit">Save</button></div>
    </form>` : ""}`;
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}
panel.addEventListener("click", async (e) => {
  if (e.target.closest(".x")) return closePanel();
  if (e.target.closest("#copy")) {
    const text = document.getElementById("cmd").textContent;
    try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into Terminal."); }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("cmd")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected. Press ⌘C to copy."); }
    return;
  }
  const sb = e.target.closest("[data-state]");
  if (sb) {
    draftState = sb.dataset.state;
    panel.querySelectorAll(".states button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.state === draftState));
  }
});
panel.addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = state.openId, p = state.projects[id] || {};
  const msg = document.getElementById("msg");
  const next = JSON.parse(JSON.stringify(p));
  next.state = draftState || p.state || "active";
  next.step = document.getElementById("f-step").value.trim();
  next.sessionUrl = document.getElementById("f-url").value.trim();
  next.command = document.getElementById("f-cmd").value.trim();
  next.updatedAt = new Date().toISOString().slice(0, 10);
  if (!next.name) next.name = ROOMS.find((r) => r.id === id).label;
  msg.textContent = "Saving…";
  try { await state.db.doc("projects/" + id).set(next); draftState = null; toast(`${next.name} saved.`); }
  catch (err) {
    if (err && err.code === "invalid_argument") { state.canWrite = false; renderPanel(id); toast("You can view this page but not change it."); }
    else msg.textContent = "Couldn't save. Try again in a moment.";
  }
});
backdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !panel.hidden) closePanel();
  const t = e.target.closest && e.target.closest(".scene[data-open]");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPanel(t.dataset.open); }
});
building.addEventListener("click", (e) => { const t = e.target.closest("[data-open]"); if (t) openPanel(t.dataset.open); });

let toastTimer;
function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600); }

/* ---------- data ---------- */
async function connect() {
  if (!window.claude || !window.claude.use) { state.unavailable = true; render(); return; }
  const db = await window.claude.use("db");
  if (!db) { state.unavailable = true; render(); return; }
  state.db = db;
  try { const user = await window.claude.use("user"); if (user) state.canWrite = await user.can("data.write"); } catch {}
  db.collection("projects").onSnapshot((snap) => {
    const next = {};
    snap.docs.forEach((d) => { const v = d.data(); if (v && STATES.includes(v.state)) next[d.id] = v; });
    state.projects = next; state.loaded = true; render();
  }, () => { state.unavailable = true; render(); });
}
render();
connect();
})();
</script>
