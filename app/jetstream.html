<title>Operation Jetstream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #EDF0F3;
    --surface: #FFFFFF;
    --surface-2: #F5F7F9;
    --ink: #121A24;
    --ink-2: #465262;
    --ink-3: #6F7B8A;
    --line: #D6DCE3;
    --accent: #2446A8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2E8F8;
    --good: #1C7449;
    --good-soft: #DFF1E7;
    --warn: #8F5B00;
    --warn-soft: #FAEFD8;
    --bad: #AE2A20;
    --bad-soft: #F9E3E0;
    --stamp: #AE2A20;
    --shadow: 0 1px 2px rgba(18, 26, 36, .06), 0 4px 14px rgba(18, 26, 36, .05);
    --display: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Public Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0D131A;
      --surface: #151D27;
      --surface-2: #1A2430;
      --ink: #E5EBF1;
      --ink-2: #A7B2BF;
      --ink-3: #7F8B99;
      --line: #2A3644;
      --accent: #92AAFF;
      --accent-ink: #0D131A;
      --accent-soft: #1D2948;
      --good: #63CE96;
      --good-soft: #12301F;
      --warn: #E6B45A;
      --warn-soft: #33270E;
      --bad: #FF8F84;
      --bad-soft: #3A1815;
      --stamp: #FF8F84;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0D131A;
    --surface: #151D27;
    --surface-2: #1A2430;
    --ink: #E5EBF1;
    --ink-2: #A7B2BF;
    --ink-3: #7F8B99;
    --line: #2A3644;
    --accent: #92AAFF;
    --accent-ink: #0D131A;
    --accent-soft: #1D2948;
    --good: #63CE96;
    --good-soft: #12301F;
    --warn: #E6B45A;
    --warn-soft: #33270E;
    --bad: #FF8F84;
    --bad-soft: #3A1815;
    --stamp: #FF8F84;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.5 var(--body);
    padding: 0 16px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 64px; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* Masthead */
  .mast { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
  .mast h1 { margin: 0; font: 700 clamp(30px, 5vw, 44px)/1 var(--display); letter-spacing: .01em; text-transform: uppercase; }
  .mast .file { font: 600 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }
  .stamp { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); font: 600 11px/1 var(--mono); letter-spacing: .16em; padding: 5px 8px 4px; transform: rotate(-3deg); text-transform: uppercase; border-radius: 3px; margin-left: 10px; vertical-align: 6px; }
  .runline { font: 12px/1.5 var(--mono); color: var(--ink-2); text-align: right; }
  .runline b { color: var(--ink); font-weight: 600; }

  /* Summary strip */
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .strip button { all: unset; cursor: pointer; padding: 14px 4px 14px 0; display: flex; flex-direction: column; gap: 2px; }
  .strip button:focus-visible { outline: 2px solid var(--accent); }
  .strip .n { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
  .strip .l { font: 600 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .strip .due .n { color: var(--warn); }
  @media (max-width: 560px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Tabs */
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 18px 0 20px; }
  nav.tabs button { border: 1px solid transparent; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--ground); }
  nav.tabs button:hover:not([aria-selected="true"]) { border-color: var(--line); }

  .notice { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 16px 18px; color: var(--ink-2); margin-bottom: 20px; }
  .notice strong { color: var(--ink); }
  .sechead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin: 26px 0 12px; }
  .sechead h2 { margin: 0; font: 700 22px/1.2 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
  .sechead .meta { font: 12px var(--mono); color: var(--ink-3); }

  /* Job cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .card.is-selected { border-color: var(--good); box-shadow: 0 0 0 1px var(--good), var(--shadow); }
  .card .top { padding: 14px 16px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .card .co { font-weight: 600; color: var(--ink-2); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .card h3 { margin: 2px 0 0; font: 700 21px/1.15 var(--display); text-wrap: balance; grid-column: 1; }
  .score { grid-row: 1 / span 2; grid-column: 2; text-align: center; min-width: 64px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
  .score .v { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; display: block; }
  .score .t { font: 600 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .score.s-strong { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .score.s-good { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .score.s-stretch { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .score.s-weak { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .chip { font: 600 10.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
  .chip.watch { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip.fb { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .facts { margin: 14px 16px 0; display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 14px; }
  .facts dt { font: 600 11px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .facts .missing { color: var(--ink-3); }
  .fit { margin: 14px 16px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
  .fit p { margin: 0 0 8px; color: var(--ink); }
  .fit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .fit li { padding-left: 18px; position: relative; }
  .fit li::before { position: absolute; left: 0; font: 700 14px/1.45 var(--mono); }
  .fit li.pro::before { content: "+"; color: var(--good); }
  .fit li.con::before { content: "–"; color: var(--bad); }
  .card .actions { margin-top: auto; padding: 14px 16px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 13px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary.on { background: var(--good); border-color: var(--good); }
  .btn.ghost { border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { border-color: var(--line); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .card .actions .link { margin-left: auto; }
  .example { position: relative; }
  .example::after { content: "Example"; position: absolute; top: 12px; right: -34px; transform: rotate(35deg); background: var(--stamp); color: var(--surface); font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 5px 40px; }
  .example .score { visibility: visible; }

  details.older { margin-top: 28px; }
  details.older > summary { cursor: pointer; font: 700 18px/1.2 var(--display); text-transform: uppercase; letter-spacing: .02em; color: var(--ink-2); padding: 8px 0; }
  details.older[open] > summary { margin-bottom: 12px; }

  /* Pipeline */
  .group { margin-bottom: 22px; }
  .group h3 { margin: 0 0 8px; font: 600 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
  .group h3 .count { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; color: var(--ink-2); }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; }
  .row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 14px; align-items: center; }
  .row > summary::-webkit-details-marker { display: none; }
  .row .who { min-width: 0; }
  .row .who b { display: block; font: 700 17px/1.2 var(--display); }
  .row .who span { color: var(--ink-2); font-size: 13.5px; }
  .row .flags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
  .row[open] > summary { border-bottom: 1px solid var(--line); }
  .edit { padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px 16px; }
  .edit label { display: flex; flex-direction: column; gap: 4px; font: 600 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .edit input, .edit select, .edit textarea { font: 14px/1.4 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
  .edit textarea { min-height: 84px; resize: vertical; }
  .edit .wide { grid-column: 1 / -1; }
  .edit .readout { font: 14px/1.5 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); background: none; padding: 0; }
  .stage-sel { font-weight: 600; font-size: 13px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); }

  /* Watch list */
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 24px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { margin: 0 0 4px; font: 700 20px/1.2 var(--display); text-transform: uppercase; }
  .panel > p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
  form.add { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 8px; margin-bottom: 14px; }
  form.add input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 14px; width: 100%; }
  form.add .full { grid-column: 1 / -1; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
  .list li b { font-weight: 600; }
  .list li small { display: block; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
  .empty { color: var(--ink-3); font-size: 14px; padding: 10px 0; border-top: 1px solid var(--line); }

  /* Stats */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .tile .n { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
  .tile .l { font: 600 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
  thead th { border-top: 0; font: 600 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; align-items: end; height: 150px; padding: 16px 16px 0; }
  .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .bar i { display: block; width: 100%; max-width: 44px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar .bv { font: 600 12px var(--mono); color: var(--ink-2); }
  .barlabels { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; padding: 6px 16px 12px; font: 11px var(--mono); color: var(--ink-3); text-align: center; text-transform: uppercase; }

  /* Rules */
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  .rules dl { margin: 0; display: grid; gap: 10px; }
  .rules dt { font: 600 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .rules dd { margin: 0; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 14px; border-radius: 8px; display: flex; gap: 14px; align-items: center; font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); z-index: 10; max-width: calc(100% - 32px); }
  .toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color .15s, box-shadow .15s; }
  }
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Operation Jetstream<span class="stamp">Eyes only</span></h1>
      <div class="file">File 21701 · 45-min radius + remote · Floor $100K</div>
    </div>
    <div class="runline" id="runline">Waiting for the first morning run</div>
  </header>

  <div class="strip" id="strip"></div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-report" data-tab="report" aria-selected="true">Morning report</button>
    <button role="tab" id="tab-pipeline" data-tab="pipeline" aria-selected="false">Tracker</button>
    <button role="tab" id="tab-watch" data-tab="watch" aria-selected="false">Watch list</button>
    <button role="tab" id="tab-stats" data-tab="stats" aria-selected="false">Stats</button>
    <button role="tab" id="tab-rules" data-tab="rules" aria-selected="false">Search rules</button>
  </nav>

  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  "use strict";

  var STAGES = ["Researching", "Ready to apply", "Applied", "Recruiter screen", "Interviewing", "Final round", "Offer", "Accepted", "Declined", "Rejected", "No response", "Withdrawn"];
  var CLOSED = ["Accepted", "Declined", "Rejected", "No response", "Withdrawn"];
  var INTERVIEW_STAGES = ["Recruiter screen", "Interviewing", "Final round", "Offer"];

  var state = { db: null, dbReady: false, dbError: "", jobs: [], companies: [], people: [], profile: null, runs: [], tab: "report" };
  var view = document.getElementById("view");
  var pendingRender = false;

  try { var saved = localStorage.getItem("jetstream.tab"); if (saved) state.tab = saved; } catch (e) {}
  if (/^#(report|pipeline|watch|stats|rules)$/.test(location.hash)) state.tab = location.hash.slice(1);

  // ---------- helpers ----------
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (c) { if (c == null || c === false) return; el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return el;
  }
  function today() { var d = new Date(); return iso(d); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(isoDate, n) { var p = isoDate.split("-").map(Number); var d = new Date(p[0], p[1] - 1, p[2]); d.setDate(d.getDate() + n); return iso(d); }
  function fmtDate(s) { if (!s) return ""; var p = String(s).slice(0, 10).split("-").map(Number); if (p.length < 3 || !p[0]) return String(s); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function money(n) { return "$" + Math.round(n / 1000) + "K"; }
  function salaryText(j) {
    if (j.salaryMin || j.salaryMax) {
      var s = j.salaryMin && j.salaryMax ? money(j.salaryMin) + "–" + money(j.salaryMax) : money(j.salaryMin || j.salaryMax);
      return s + (j.salaryPeriod && j.salaryPeriod !== "year" ? " /" + j.salaryPeriod : "") + (j.salarySource ? " · " + j.salarySource : "");
    }
    return j.salaryText || "";
  }
  function scoreTier(n) { if (n >= 80) return ["s-strong", "Strong fit"]; if (n >= 65) return ["s-good", "Good fit"]; if (n >= 50) return ["s-stretch", "Stretch"]; return ["s-weak", "Weak fit"]; }
  function followUpDue(j) { return j.status === "selected" && j.stage === "Applied" && !j.heardBack && j.followUpAt && j.followUpAt <= today(); }
  function toast(msg, undo) {
    var t = document.getElementById("toast");
    t.textContent = "";
    t.appendChild(h("span", { text: msg }));
    if (undo) t.appendChild(h("button", { type: "button", text: "Undo", onclick: function () { t.hidden = true; undo(); } }));
    t.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.hidden = true; }, 6000);
  }
  function writeJob(id, patch) {
    if (!state.db) return Promise.resolve();
    patch.updatedAt = new Date().toISOString();
    return state.db.doc("jobs/" + id).update(patch).catch(function (e) {
      toast(e && e.code === "invalid_argument" ? "You can view this tracker but not change it." : "Couldn't save that change. Try again.");
    });
  }
  function latestReportDate() {
    if (state.runs.length) return state.runs[0].date;
    var d = state.jobs.map(function (j) { return j.reportDate || ""; }).sort().pop();
    return d || null;
  }

  // ---------- rendering ----------
  function render() {
    var act = document.activeElement;
    if (act && view.contains(act) && act.matches("input, textarea, select")) { pendingRender = true; return; }
    pendingRender = false;
    renderStrip();
    renderRunline();
    document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)); });
    view.textContent = "";
    if (!state.dbReady) {
      view.appendChild(h("div", { class: "notice" }, [h("strong", { text: state.dbError ? "The tracker's storage isn't available here. " : "Connecting to your tracker… " }), state.dbError || ""]));
      if (!state.dbError) return;
    }
    ({ report: renderReport, pipeline: renderPipeline, watch: renderWatch, stats: renderStats, rules: renderRules })[state.tab]();
  }
  view.addEventListener("focusout", function () { setTimeout(function () { if (pendingRender) render(); }, 0); });

  function renderStrip() {
    var rd = latestReportDate();
    var fresh = state.jobs.filter(function (j) { return j.status === "new" && rd && j.reportDate === rd; }).length;
    var waiting = state.jobs.filter(function (j) { return j.status === "new"; }).length;
    var active = state.jobs.filter(function (j) { return j.status === "selected" && CLOSED.indexOf(j.stage) < 0; }).length;
    var due = state.jobs.filter(followUpDue).length;
    var strip = document.getElementById("strip");
    strip.textContent = "";
